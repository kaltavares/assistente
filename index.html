<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente Médico - Prompts Gemini</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --sidebar-bg: #1e293b;
      --sidebar-text: #94a3b8;
      --sidebar-active: #38bdf8;
      --card-bg: #ffffff;
      --text-color: #334155;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { display: flex; height: 100vh; background-color: var(--bg-color); color: var(--text-color); }

    /* Sidebar */
    #sidebar { width: 280px; background-color: var(--sidebar-bg); display: flex; flex-direction: column; padding: 20px 0; flex-shrink: 0; }
    #sidebar h2 { color: #f8fafc; font-size: 1.1rem; padding: 0 20px 20px; border-bottom: 1px solid #334155; }
    .nav-btn { background: none; border: none; color: var(--sidebar-text); padding: 14px 20px; text-align: left; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; width: 100%; }
    .nav-btn:hover { background-color: #334155; color: #f8fafc; }
    .nav-btn.active { background-color: #0f172a; color: var(--sidebar-active); font-weight: 600; border-left: 4px solid var(--sidebar-active); }

    /* Configuração de API Key no Rodapé da Sidebar */
    .api-config { margin-top: auto; padding: 20px; border-top: 1px solid #334155; }
    .api-config label { display: block; color: #94a3b8; font-size: 0.8rem; margin-bottom: 5px; }
    .api-config input { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.85rem; }

    /* Main Content */
    #main { flex: 1; display: flex; flex-direction: column; padding: 25px; overflow-y: auto; }
    .header { margin-bottom: 20px; }
    .header h1 { font-size: 1.5rem; color: #0f172a; }
    .header p { color: #64748b; font-size: 0.9rem; }

    .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: calc(100vh - 120px); }
    .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; }
    .panel h3 { font-size: 1rem; margin-bottom: 10px; color: #1e293b; }

    textarea { flex: 1; border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-size: 0.95rem; resize: none; outline: none; font-family: monospace; }
    textarea:focus { border-color: var(--primary); }

    .btn-action { margin-top: 15px; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-action:hover { background-color: var(--primary-hover); }
    .btn-copy { background-color: #475569; margin-top: 10px; }
    .btn-copy:hover { background-color: #334155; }

    #output { background-color: #f8fafc; white-space: pre-wrap; font-family: monospace; font-size: 0.9rem; }

    /* Loading */
    .loading { display: none; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; color: var(--primary); font-weight: 600; }

    @media (max-width: 900px) {
      body { flex-direction: column; }
      #sidebar { width: 100%; height: auto; }
      .content-grid { grid-template-columns: 1fr; height: auto; }
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>Assistente Médico</h2>
    <button class="nav-btn active" onclick="setTab('evolucao')">Evolução Médica</button>
    <button class="nav-btn" onclick="setTab('ambu')">Estruturação Ambu</button>
    <button class="nav-btn" onclick="setTab('exames')">Resumo de Exames</button>
    <button class="nav-btn" onclick="setTab('atestados')">Atestados/Insumos/Laudos</button>
    <button class="nav-btn" onclick="setTab('alta')">Resumo/Alta Hospitalar</button>
    <button class="nav-btn" onclick="setTab('vitais')">Sinais Vitais</button>
    <button class="nav-btn" onclick="setTab('encaminhamento')">Encaminhamentos</button>

    <div class="api-config">
      <label for="apiKey">Sua Gemini API Key:</label>
      <input type="password" id="apiKey" placeholder="Cole sua chave aqui" onchange="saveKey()">
    </div>
  </div>

  <div id="main">
    <div class="header">
      <h1 id="tab-title">Evolução Médica</h1>
      <p id="tab-desc">Cole os dados brutos para gerar a evolução padronizada em Plain Text.</p>
    </div>

    <div class="content-grid">
      <div class="panel">
        <h3>Dados de Entrada</h3>
        <textarea id="inputData" placeholder="Cole aqui o texto bruto, exames ou anotações..."></textarea>
        <button class="btn-action" onclick="processPrompt()">Gerar Documento</button>
        <div class="loading" id="loadingState"><span>Processando com Gemini API...</span></div>
      </div>

      <div class="panel">
        <h3>Resultado Formatado</h3>
        <textarea id="output" readonly placeholder="O resultado aparecerá aqui..."></textarea>
        <button class="btn-action btn-copy" onclick="copyResult()">Copiar Texto</button>
      </div>
    </div>
  </div>

  <script>
    // System Prompts Mapeados
    const SYSTEM_PROMPTS = {
      evolucao: `Você é um assistente médico especializado na redação de Evoluções Médicas Hospitalares (Enfermaria/UTI/Cirurgia/Clínica Médica). Sua tarefa é receber informações do paciente e estruturá-las no modelo de evolução abaixo em PLAIN TEXT... (Regras: Texto corrido na HDA e Evolução, sem rótulos explícitos de sistemas na evolução, exame físico em abreviações médicas padronizadas).`,
      
      ambu: `Instrução do usuário: Ajuste apenas as quebras de linha e parágrafos do texto mantendo estritamente o texto original, termos médicos e cabeçalhos. Preserve 100% da escrita original. A saída deve ser em Plain Text dentro de bloco de código sem Markdown extra.`,
      
      exames: `Formato do resumo de exames: [DATA DD/MM]: HB [Hb] | HT [Ht] | LEUC [Leuc] | BAST [Bast_abs] ([Bast_%]%) | SEGM [Segm_abs] ([Segm_%]%) | EOS [Eos_abs] ([Eos_%]%) | LINF [Linf_abs] ([Linf_%]%) | MONO [Mono_abs] ([Mono_%]%) | BASO [Baso_abs] ([Baso_%]%) | PLAQ [Plaq] | [DEMAIS PARÂMETROS SEPARADOS POR "|"]. Manutenção estrita em uma única linha contínua.`,
      
      atestados: `Você é um assistente médico especialista em redação de documentos clínicos para Medicina Interna / Clínica Médica do HUC / ISGH. Gere atestados, laudos e justificativas de insumos. Assinatura padrão ao final: DR. KALEB TAVARES, MR CLÍNICA MÉDICA, CRM/CE 30974.`,
      
      alta: `Você é um assistente médico especializado na síntese e estruturação de prontuários. Gere um Resumo de Alta Hospitalar narrativo integrado e conciso. Para pacientes cirúrgicos, inclua o bloco "PROCEDIMENTO CIRÚRGICO E ACHADOS".`,
      
      vitais: `Você é um assistente especialista em análise de prontuários médicos. Analise as informações/imagens dos sinais vitais das últimas 24h e apresente em uma única linha por paciente no formato: # PARÂMETROS: SAT: **val%** | DX: **val** | PA: val | FR: val | FC: val | TEMP: val. Destaque em negrito alterações críticas.`,
      
      encaminhamento: `Você é um assistente médico responsável por gerar Solicitações de Encaminhamento / Parecer / Transferência. Estruture a resposta estritamente no modelo formal com os 7 tópicos padronizados e a assinatura ao final.`
    };

    let currentTab = 'evolucao';

    // Carregar chave salva
    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) document.getElementById('apiKey').value = savedKey;
    };

    function saveKey() {
      const key = document.getElementById('apiKey').value.trim();
      localStorage.setItem('gemini_api_key', key);
    }

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const titles = {
        evolucao: 'Evolução Médica',
        ambu: 'Estruturação Ambu',
        exames: 'Resumo de Exames',
        atestados: 'Atestados / Insumos / Laudos',
        alta: 'Resumo / Alta Hospitalar',
        vitais: 'Sinais Vitais',
        encaminhamento: 'Encaminhamentos / Parecer'
      };

      document.getElementById('tab-title').innerText = titles[tab];
      document.getElementById('inputData').value = '';
      document.getElementById('output').value = '';
    }

    async function processPrompt() {
      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        alert('Por favor, insira sua API Key no campo no canto inferior esquerdo.');
        return;
      }

      const input = document.getElementById('inputData').value.trim();
      if (!input) {
        alert('Insira as informações no campo de entrada.');
        return;
      }

      const loading = document.getElementById('loadingState');
      loading.style.display = 'flex';

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: SYSTEM_PROMPTS[currentTab] },
                { text: `\n\nDADOS FORNECIDOS PELO MÉDICO:\n${input}` }
              ]
            }]
          })
        });

        const data = await response.json();
        
        if (data.error) {
          alert(`Erro na API: ${data.error.message}`);
        } else {
          const textResult = data.candidates[0].content.parts[0].text;
          document.getElementById('output').value = textResult.replace(/```text/g, '').replace(/```/g, '').trim();
        }
      } catch (err) {
        alert('Erro ao conectar com a API do Gemini. Verifique sua chave ou sua conexão.');
      } finally {
        loading.style.display = 'none';
      }
    }

    function copyResult() {
      const output = document.getElementById('output');
      if (!output.value) return;
      output.select();
      document.execCommand('copy');
      alert('Texto copiado para a área de transferência!');
    }
  </script>
</body>
</html>
