<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente OCR / Leitor de Documentos</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #10b981;
      --accent-hover: #059669;
      --border-color: #334155;
      --error-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 800px;
      padding: 24px;
      border: 1px solid var(--border-color);
    }

    /* Modal de PIN */
    #pin-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .pin-card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      text-align: center;
      max-width: 320px;
      width: 100%;
    }

    .pin-card h2 {
      margin-bottom: 16px;
      font-size: 1.2rem;
    }

    .pin-card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: #fff;
      font-size: 1.2rem;
      text-align: center;
      letter-spacing: 4px;
    }

    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--text-color);
    }

    .upload-section {
      margin-bottom: 24px;
    }

    .file-input-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      background-color: rgba(15, 23, 42, 0.5);
      cursor: pointer;
      transition: border-color 0.3s;
    }

    .file-input-wrapper:hover {
      border-color: var(--accent-color);
    }

    input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0;
      cursor: pointer;
    }

    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 16px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:disabled {
      background-color: var(--border-color);
      cursor: not-allowed;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .output-title {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--accent-color);
    }

    .error-tag {
      color: var(--error-color);
    }

    .output-box {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      min-height: 150px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 0.95rem;
      color: #e2e8f0;
      overflow-x: auto;
    }

    .preview-img {
      max-width: 100%;
      max-height: 200px;
      margin-top: 12px;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Tela do PIN de Acesso -->
  <div id="pin-modal">
    <div class="pin-card">
      <h2>PIN de Acesso</h2>
      <input type="password" id="pin-input" placeholder="****" maxlength="8">
      <button onclick="validarPIN()">Entrar</button>
      <p id="pin-error" style="color: var(--error-color); margin-top: 10px; font-size: 0.85rem; display: none;">PIN incorreto</p>
    </div>
  </div>

  <div class="container">
    <header>
      <h1>Digitalizador / Processador de Documentos</h1>
    </header>

    <div class="upload-section">
      <div class="file-input-wrapper">
        <span id="file-label">Clique para selecionar uma imagem (JPG, PNG)</span>
        <input type="file" id="image-file" accept="image/*" onchange="previewImage(event)">
        <img id="image-preview" class="preview-img" alt="Pré-visualização">
      </div>
      <button id="process-btn" onclick="processarImagem()">Processar Imagem</button>
    </div>

    <div class="output-section">
      <div class="output-header">
        <span class="output-title" id="status-title">RESULTADO DIGITALIZADO / FORMATADO</span>
        <span class="output-title error-tag" id="error-status" style="display: none;">Erro no processamento</span>
      </div>
      <div class="output-box" id="output-text">Aguardando envio do arquivo...</div>
    </div>
  </div>

  <script>
    // Cole aqui a sua nova chave (pode ser no formato AQ.Ab8RN6... ou AIzaSy...)
    const API_KEY = "AQ.Ab8RN6Iw5q--lhOXK4iwI4qmruuMb-8yPQJnuwi7tp2dEEeEiA";

    // Validação de PIN
    function validarPIN() {
      const pin = document.getElementById('pin-input').value;
      if (pin === "1995") {
        document.getElementById('pin-modal').style.display = 'none';
      } else {
        document.getElementById('pin-error').style.display = 'block';
      }
    }

    // Permite apertar Enter no input do PIN
    document.getElementById('pin-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') validarPIN();
    });

    let base64Image = null;

    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('file-label').textContent = file.name;
      const preview = document.getElementById('image-preview');
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';

      const reader = new FileReader();
      reader.onload = function() {
        base64Image = reader.result.split(',')[1];
      };
      reader.readAsDataURL(file);
    }

    async function processarImagem() {
      const outputBox = document.getElementById('output-text');
      const errorStatus = document.getElementById('error-status');
      const processBtn = document.getElementById('process-btn');

      if (!base64Image) {
        alert("Por favor, selecione uma imagem antes.");
        return;
      }

      outputBox.textContent = "Processando imagem, por favor aguarde...";
      errorStatus.style.display = 'none';
      processBtn.disabled = true;

      // Endpoint oficial ajustado para o Gemini 2.5 Flash
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;

      const requestBody = {
        contents: [
          {
            parts: [
              {
                text: "Transcreva todo o texto presente nesta imagem. Mantenha a formatação o mais fiel possível ao original."
              },
              {
                inlineData: {
                  mimeType: "image/jpeg",
                  data: base64Image
                }
              }
            ]
          }
        ]
      };

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-goog-api-key': API_KEY
          },
          body: JSON.stringify(requestBody)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || `Erro de requisição (Código HTTP ${response.status})`);
        }

        const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        
        if (resultText) {
          outputBox.textContent = resultText;
        } else {
          outputBox.textContent = "Nenhum texto pôde ser extraído da imagem.";
        }

      } catch (err) {
        console.error(err);
        errorStatus.style.display = 'inline';
        outputBox.textContent = `Falha no processamento: ${err.message}`;
      } finally {
        processBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
