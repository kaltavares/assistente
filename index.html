<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente Médico • Evolução e Prontuários</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
    }
    
    /* Scrollbar personalizada dark */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f19;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f293d;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #374151;
    }

    .glass-card {
      background-color: #111827;
      border: 1px solid #1f293d;
    }

    .nav-tab-active {
      background-color: #1f2937;
      color: #38bdf8;
      border: 1px solid #374151;
    }

    .nav-tab-inactive {
      color: #9ca3af;
    }
    .nav-tab-inactive:hover {
      background-color: #161e2e;
      color: #e5e7eb;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Header Navigation -->
  <header class="glass-card border-b border-gray-800/80 sticky top-0 z-50 bg-opacity-90 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- Brand & Subtitle -->
        <div class="flex items-center space-x-3">
          <div class="p-2 bg-blue-600/20 text-blue-400 rounded-lg border border-blue-500/30">
            <i data-lucide="stethosocpe" class="w-6 h-6"></i>
          </div>
          <div>
            <h1 class="text-base font-bold tracking-wide text-white flex items-center gap-2">
              Assistente Médico <span class="text-xs font-normal px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">Pro</span>
            </h1>
            <p class="text-xs text-gray-400">Padronizador de Evoluções e Documentos Clínicos</p>
          </div>
        </div>

        <!-- Badges / Status Bar Top Right -->
        <div class="hidden md:flex items-center space-x-3">
          <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            Gemini Conectado
          </span>
          <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium bg-gray-800 text-gray-300 border border-gray-700 gap-1">
            <i data-lucide="shield-check" class="w-3.5 h-3.5 text-blue-400"></i> Local & Seguro
          </span>
        </div>

      </div>

      <!-- Navigation Tabs (Estilo Pill) -->
      <div class="flex space-x-1 py-2 overflow-x-auto no-scrollbar border-t border-gray-800/50">
        <button class="nav-tab-active px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-2">
          <i data-lucide="file-text" class="w-3.5 h-3.5"></i> Evolução Médica
        </button>
        <button class="nav-tab-inactive px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-2">
          <i data-lucide="building-2" class="w-3.5 h-3.5"></i> Estruturação Ambu
        </button>
        <button class="nav-tab-inactive px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-2">
          <i data-lucide="activity" class="w-3.5 h-3.5"></i> Resumo de Exames
        </button>
        <button class="nav-tab-inactive px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-2">
          <i data-lucide="clipboard-list" class="w-3.5 h-3.5"></i> Atestados / Laudos
        </button>
        <button class="nav-tab-inactive px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-2">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Alta Hospitalar
        </button>
      </div>
    </div>
  </header>

  <!-- Main Work Area -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">

    <!-- Page Title / Header Info -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h2 class="text-xl font-bold text-white flex items-center gap-2">
          <i data-lucide="sparkles" class="w-5 h-5 text-indigo-400"></i> Evolução Médica
        </h2>
        <p class="text-xs text-gray-400 mt-0.5">Cole os dados brutos ou anotações para gerar a evolução padronizada em Plain Text.</p>
      </div>
    </div>

    <!-- Dual Workspace Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

      <!-- Left Input Panel -->
      <div class="glass-card rounded-xl p-5 flex flex-col justify-between shadow-xl">
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <label for="inputText" class="text-xs font-semibold uppercase tracking-wider text-gray-300 flex items-center gap-2">
              <i data-lucide="edit-3" class="w-4 h-4 text-blue-400"></i> Dados de Entrada
            </label>
            <button onclick="document.getElementById('inputText').value=''" class="text-xs text-gray-400 hover:text-red-400 transition flex items-center gap-1">
              <i data-lucide="trash-2" class="w-3 h-3"></i> Limpar
            </button>
          </div>
          
          <textarea id="inputText" rows="18" 
            class="w-full bg-gray-900/90 text-gray-100 placeholder-gray-500 border border-gray-800 rounded-lg p-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition resize-none font-mono"
            placeholder="Cole aqui o texto bruto, histórico clínico, exames de laboratório ou anotações rápidas do plantão..."></textarea>
        </div>

        <button id="btnProcess" onclick="processarTexto()" 
          class="mt-4 w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium py-3 px-4 rounded-lg shadow-lg shadow-blue-500/10 transition duration-200 flex items-center justify-center gap-2 text-sm">
          <i data-lucide="wand-2" class="w-4 h-4"></i> Gerar Documento Padronizado
        </button>
      </div>

      <!-- Right Output Panel -->
      <div class="glass-card rounded-xl p-5 flex flex-col justify-between shadow-xl">
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <label for="outputText" class="text-xs font-semibold uppercase tracking-wider text-emerald-400 flex items-center gap-2">
              <i data-lucide="check-circle-2" class="w-4 h-4"></i> Resultado Formatado
            </label>
            <span id="statusIndicator" class="text-xs text-gray-500">Aguardando dados...</span>
          </div>

          <textarea id="outputText" rows="18" readonly
            class="w-full bg-gray-900/90 text-emerald-300 placeholder-gray-600 border border-gray-800 rounded-lg p-3.5 text-sm focus:outline-none resize-none font-mono"
            placeholder="O resultado formatado e estruturado aparecerá aqui..."></textarea>
        </div>

        <button id="btnCopy" onclick="copiarResultado()" 
          class="mt-4 w-full bg-gray-800 hover:bg-gray-700 text-gray-200 font-medium py-3 px-4 rounded-lg border border-gray-700 transition duration-200 flex items-center justify-center gap-2 text-sm">
          <i data-lucide="copy" class="w-4 h-4"></i> Copiar Texto Formatado
        </button>
      </div>

    </div>

  </main>

  <script>
    // Inicializa ícones do Lucide
    lucide.createIcons();

    // =========================================================================
    // COLE SUA CHAVE DO GEMINI ENTRE AS ASPAS NA LINHA ABAIXO:
    // =========================================================================
    const API_KEY = "AQ.Ab8RN6KhyQcrVrzh92FVxkC2D32QonPMH8fhTZvRnjKyFuGsmA"; 

    async function processarTexto() {
      const input = document.getElementById("inputText").value.trim();
      const output = document.getElementById("outputText");
      const status = document.getElementById("statusIndicator");
      const btn = document.getElementById("btnProcess");

      if (!input) {
        alert("Por favor, cole algum texto no campo de entrada.");
        return;
      }

      if (!API_KEY || API_KEY === "SUA_GEMINI_API_KEY_AQUI") {
        alert("Por favor, substitua 'SUA_GEMINI_API_KEY_AQUI' pela sua chave real do Gemini no código.");
        return;
      }

      // UI Loading State
      btn.disabled = true;
      btn.classList.add("opacity-50", "cursor-not-allowed");
      status.innerText = "Processando com Gemini...";
      status.className = "text-xs text-blue-400 animate-pulse";
      output.value = "Gerando documento, por favor aguarde...";

      const promptSystem = "Você é um assistente médico especialista em prontuários. Organize, corrija a ortografia e formate as informações fornecidas em uma Evolução Médica padronizada e limpa (Plain Text). Mantenha o tom estritamente clínico e técnico.";

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: `${promptSystem}\n\nTexto para organizar:\n${input}` }]
            }]
          })
        });

        const data = await response.json();

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          output.value = data.candidates[0].content.parts[0].text;
          status.innerText = "Concluído com sucesso!";
          status.className = "text-xs text-emerald-400";
        } else {
          throw new Error("Resposta inválida da API");
        }
      } catch (err) {
        console.error(err);
        output.value = "Erro ao processar dados. Verifique a chave da API ou tente novamente.";
        status.innerText = "Erro no processamento";
        status.className = "text-xs text-red-400";
      } finally {
        btn.disabled = false;
        btn.classList.remove("opacity-50", "cursor-not-allowed");
      }
    }

    function copiarResultado() {
      const output = document.getElementById("outputText");
      if (!output.value) return;

      navigator.clipboard.writeText(output.value);
      
      const btnCopy = document.getElementById("btnCopy");
      const originalHTML = btnCopy.innerHTML;
      
      btnCopy.innerHTML = `<i data-lucide="check" class="w-4 h-4 text-emerald-400"></i> Copiado!`;
      lucide.createIcons();
      
      setTimeout(() => {
        btnCopy.innerHTML = originalHTML;
        lucide.createIcons();
      }, 2000);
    }
  </script>
</body>
</html>
